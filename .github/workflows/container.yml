name: Publish container to GHCR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий релизный тег, например v1.0.0"
        required: true
        type: string

concurrency:
  group: container-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      VITE_BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify version and image name
        id: image
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH, got: $RELEASE_TAG"
            exit 1
          fi
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          REVISION=$(git rev-parse HEAD)
          test "$REVISION" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: GITHUB_SHA="$RELEASE_COMMIT" npm run build
        env:
          RELEASE_COMMIT: ${{ steps.image.outputs.revision }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned and latest images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ steps.image.outputs.revision }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
