<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="calqnotes" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- viewport-fit=cover — отступы от вырезов и скруглений задаём сами через env(safe-area-inset-*);
       interactive-widget=resizes-content — на Android клавиатура уменьшает страницу, а не перекрывает её -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Заметки-калькулятор: пишите расчёт строкой, результат появится рядом" />
  <!-- Цвет панели браузера = фон приложения (--background) в светлой и тёмной теме -->
  <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <!-- Фон и тема до загрузки приложения, иначе при обновлении страницы мелькает белый.
       Цвета — --background из src/index.css; логика темы — shared/lib/theme.ts -->
  <style>
    html { background: #FBFAF8; }
    html.dark { background: #161615; color-scheme: dark; }
  </style>
  <script>
    (() => {
      let theme = "system";
      try {
        const saved = JSON.parse(localStorage.getItem("calqnotes-settings") || "null");
        theme = saved?.state?.theme || localStorage.getItem("calqnotes-theme") || "system";
      } catch {}
      const dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
        meta.setAttribute("content", dark ? "#161615" : "#FBFAF8");
      }
    })();
  </script>
  <title>calqnotes</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
